services:
  sales-recon-openclaw:
    container_name: sales-recon-openclaw
    build:
      context: .
      args:
        - ${OPENCLAW_DOCKER_APT_PACKAGES}
    image: sales-recon-openclaw:latest
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      OPENCLAW_GATEWAY_BIND: "0.0.0.0"
      OPENCLAW_GATEWAY_AUTO_APPROVE: "false"
      npm_config_cache: /tmp/npm-cache
      NPM_CONFIG_PREFIX: /home/node/.npm-global
      PATH: /home/node/.npm-global/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      XAI_API_KEY: ${XAI_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY}
      DEBUG: "openclaw:*"
    volumes:
      - ${OPENCLAW_CONFIG_DIR}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR}:/home/node/.openclaw/workspace
    init: true
    restart: unless-stopped
    command: [ "node", "dist/index.js", "gateway", "--bind", "lan", "--port", "50045" ]
    networks:
      - sales-recon-net
      - webproxy

  ws-proxy:
    container_name: sales-recon-ws-proxy
    build: ./ws-proxy
    restart: unless-stopped
    image: sales-recon-ws-proxy:latest
    environment:
      OPENCLAW_URL: "ws://sales-recon-openclaw:50045"
      OPENCLAW_TOKEN: "${OPENCLAW_GATEWAY_TOKEN}"
      CLERK_PUBLISHABLE_KEY: "${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}"
      CLERK_SECRET_KEY: "${CLERK_SECRET_KEY}"
      DEBUG: "${DEBUG:-false}"
    volumes:
      - ./ws-proxy/data:/app/data
    networks:
      - sales-recon-net
      - webproxy
    depends_on:
      - sales-recon-openclaw

networks:
  sales-recon-net:
    driver: bridge
  webproxy:
    external: true
