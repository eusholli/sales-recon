services:
  sales-recon-postgres:
    container_name: sales-recon-postgres
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: gbrain
      POSTGRES_PASSWORD: ${GBRAIN_POSTGRES_PASSWORD}
      POSTGRES_DB: gbrain
    volumes:
      - sales-recon-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gbrain -d gbrain"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sales-recon-net

  sales-recon-openclaw:
    container_name: sales-recon-openclaw
    build:
      context: .
      args:
        - ${OPENCLAW_DOCKER_APT_PACKAGES}
    image: sales-recon-openclaw:latest
    depends_on:
      sales-recon-postgres:
        condition: service_healthy
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      OPENCLAW_GATEWAY_BIND: "0.0.0.0"
      OPENCLAW_GATEWAY_AUTO_APPROVE: "false"
      DATABASE_URL: "postgres://gbrain:${GBRAIN_POSTGRES_PASSWORD}@sales-recon-postgres:5432/gbrain"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # gbrain expects GOOGLE_GENERATIVE_AI_API_KEY for Gemini embeddings (768
      # dims). Alias from the existing GEMINI_API_KEY so users only manage one.
      GOOGLE_GENERATIVE_AI_API_KEY: ${GEMINI_API_KEY}
      PATH: /home/node/.bun/bin:/home/node/.npm-global/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      npm_config_cache: /tmp/npm-cache
      NPM_CONFIG_PREFIX: /home/node/.npm-global
      XAI_API_KEY: ${XAI_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY}
      BRAVE_API_KEY: ${BRAVE_API_KEY}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY}
      GPTZERO_API_KEY: ${GPTZERO_API_KEY}
      CRON_EVENT_PLANNER_DNS: ${CRON_EVENT_PLANNER_DNS}
      CRON_SECRET_KEY: ${CRON_SECRET_KEY}
      DEBUG: "openclaw:*"
    volumes:
      - ${OPENCLAW_CONFIG_DIR}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR}:/home/node/.openclaw/workspace
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:50045/').then(()=>process.exit(0)).catch(()=>process.exit(1))\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    command: [ "node", "dist/index.js", "gateway", "--bind", "lan", "--port", "50045" ]
    networks:
      - sales-recon-net
      - webproxy

  ws-proxy:
    container_name: sales-recon-ws-proxy
    build: ./ws-proxy
    restart: unless-stopped
    image: sales-recon-ws-proxy:latest
    environment:
      OPENCLAW_URL: "ws://sales-recon-openclaw:50045"
      OPENCLAW_TOKEN: "${OPENCLAW_GATEWAY_TOKEN}"
      WS_PROXY_CLERK_SECRET_KEYS: "${WS_PROXY_CLERK_SECRET_KEYS}"
      DEBUG: "${DEBUG:-false}"
      WEBAPP_URL: "${WEBAPP_URL:-http://host.docker.internal:3000}"
      CRON_SECRET_KEY: "${CRON_SECRET_KEY}"
    volumes:
      - ./ws-proxy/data:/app/data
    networks:
      - sales-recon-net
      - webproxy
    depends_on:
      - sales-recon-openclaw

volumes:
  sales-recon-pgdata:

networks:
  sales-recon-net:
    driver: bridge
  webproxy:
    external: true
